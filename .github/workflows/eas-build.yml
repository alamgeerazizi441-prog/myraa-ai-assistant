name: EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile (development / preview / production)"
        required: false
        default: "preview"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Build on EAS
        run: eas build --platform android --profile ${{ github.event.inputs.profile || 'preview' }} --non-interactive
